<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Cadastro de Vendas</h1>

        <nav>
            <a href="index.html">Produtos</a> |
            <a href="clientes.html">Clientes</a> |
            <a href="vendas.html">Vendas</a>
        </nav>

        <form id="vendaForm">

            <input type="hidden" id="id">

            <label for="data">Data</label>
            <input type="date" id="data" required>

            <label for="loja">Loja</label>
            <input type="text" id="loja" maxlength="100" required>

            <label for="cliente">Cliente</label>
            <select id="cliente" required>
                <option value="">Selecione um cliente</option>
            </select>

            <label for="produto">Produto</label>
            <select id="produto" required>
                <option value="">Selecione um produto</option>
            </select>

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" required>

            <div class="botoes">
                <button type="submit" id="btnSalvar">Cadastrar</button>

                <button type="button" id="btnCancelar"
                    class="secundario" hidden>
                    Cancelar edição
                </button>
            </div>

        </form>

        <p id="mensagem" role="status"></p>

        <h2>Vendas cadastradas</h2>

        <div class="tabela-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Loja</th>
                        <th>Cliente</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaVendas"></tbody>
            </table>

        </div>

    </main>

    <script src="vendas.js"></script>

</body>
</html>
